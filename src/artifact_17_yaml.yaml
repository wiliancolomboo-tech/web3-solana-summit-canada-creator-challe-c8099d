version: "3.8"

services:
  nexus-engine:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=CNex111111111111111111111111111111111111111
      - KEEPER_PRIVATE_KEY=[1,2,3...255]
      - RESEND_API_KEY=re_enterprise_live_key
      - RESEND_FROM_EMAIL=nexus@deliveries.solanasummit.ca
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"