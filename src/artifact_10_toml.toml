[package]
name = "veritas_creator"
version = "0.1.0"
description = "Solana Summit Canada Creator Challenge - Token-2022 Royalty & Splitter Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veritas_creator"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
spl-transfer-hook-interface = "0.6.3"
spl-tlv-account-resolution = "0.6.3"
solana-program = ">=1.18"