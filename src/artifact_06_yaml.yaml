version: "3.8"

services:
  solscribe-relay:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_RPC_WS=wss://api.devnet.solana.com
      - PROGRAM_ID=Scribe1111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3