version: "3.8"

services:
  creator-ops-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creator_ops_indexer
    restart: always
    environment:
      - SOLANA_RPC_HTTP=https://api.devnet.solana.com
      - SOLANA_RPC_WS=wss://api.devnet.solana.com
      - PROGRAM_ID=CrtrOps111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ALERT_EMAIL_TO=operations@summit-canada.xyz
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"